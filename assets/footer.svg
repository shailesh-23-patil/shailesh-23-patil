<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#f778ba"/>
    </linearGradient>
    <clipPath id="fc"><rect width="1000" height="150" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#fc)">
    <rect width="1000" height="150" fill="#0d1117"/>
    <g opacity="0.55">
      <path d="M0 95 C 150 55, 350 135, 500 95 S 850 55, 1000 95 L1000 150 L0 150 Z" fill="url(#fg)" opacity="0.5">
        <animateTransform attributeName="transform" type="translate" values="0,0;-60,6;0,0" dur="8s" repeatCount="indefinite"/>
      </path>
      <path d="M0 110 C 200 80, 300 140, 520 108 S 820 80, 1000 112 L1000 150 L0 150 Z" fill="url(#fg)" opacity="0.8">
        <animateTransform attributeName="transform" type="translate" values="0,0;50,-5;0,0" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="500" y="52" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="22" font-weight="600" fill="url(#fg)">Thanks for stopping by!</text>
    <text x="500" y="78" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="14" letter-spacing="2" fill="#8b949e">LET'S BUILD SOMETHING INTELLIGENT</text>
  </g>
</svg>
