<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#161b3a"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#f778ba"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#f778ba" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#58a6ff" opacity="0.18"/>
    </pattern>
    <clipPath id="clip"><rect width="1000" height="290" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="290" fill="url(#bg)"/>
    <rect width="1000" height="290" fill="url(#dots)"/>

    <circle cx="170" cy="70" r="110" fill="#58a6ff" opacity="0.30" filter="url(#blur)">
      <animate attributeName="cx" values="170;260;170" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;120;70" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="220" r="120" fill="#f778ba" opacity="0.25" filter="url(#blur)">
      <animate attributeName="cx" values="840;740;840" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="220;170;220" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="20" r="90" fill="#a371f7" opacity="0.22" filter="url(#blur)">
      <animate attributeName="cx" values="520;640;520" dur="13s" repeatCount="indefinite"/>
    </circle>

    <g font-family="Consolas,'Courier New',monospace" font-size="26" fill="#58a6ff" opacity="0.35">
      <text x="70" y="90">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="5s" repeatCount="indefinite"/></text>
      <text x="880" y="80" fill="#a371f7">{ }<animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="6s" repeatCount="indefinite"/></text>
      <text x="110" y="240" fill="#f778ba">∑<animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="7s" repeatCount="indefinite"/></text>
      <text x="850" y="250" fill="#58a6ff">01<animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="5.5s" repeatCount="indefinite"/></text>
      <text x="300" y="40" fill="#a371f7" font-size="20">π<animateTransform attributeName="transform" type="translate" values="0,0;0,-9;0,0" dur="6.5s" repeatCount="indefinite"/></text>
      <text x="700" y="40" fill="#f778ba" font-size="20">λ<animateTransform attributeName="transform" type="translate" values="0,0;0,-9;0,0" dur="8s" repeatCount="indefinite"/></text>
    </g>

    <text x="500" y="62" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="15" letter-spacing="5" fill="#8b949e">HELLO, WORLD</text>

    <text x="500" y="135" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="68" font-weight="800" fill="url(#name)">Shailesh Patil
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>

    <rect x="250" y="156" height="3" rx="1.5" fill="url(#bar)" width="500">
      <animate attributeName="width" values="0;500" dur="1.6s" fill="freeze"/>
      <animate attributeName="x" values="500;250" dur="1.6s" fill="freeze"/>
    </rect>

    <text x="500" y="196" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="24" fill="#c9d1d9" opacity="1">Turning raw data into real insights
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.03;0.220;0.250;1" values="0;1;1;0;0"/>
    </text>
    <text x="500" y="196" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="24" fill="#c9d1d9" opacity="0">Building AI tools like CampusGPT
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.250;0.280;0.470;0.500;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="500" y="196" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="24" fill="#c9d1d9" opacity="0">MCA Student  ·  Always learning
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.500;0.530;0.720;0.750;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="500" y="196" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="24" fill="#c9d1d9" opacity="0">Open to internships &amp; opportunities
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.750;0.780;0.970;1" values="0;0;1;1;0"/>
    </text>

    <text x="500" y="250" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="15" letter-spacing="2" fill="#8b949e">PYTHON  •  SQL  •  MACHINE LEARNING  •  AI</text>
  </g>
</svg>
